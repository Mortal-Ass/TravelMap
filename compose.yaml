name: travelmap
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: travelmap
      POSTGRES_DB: travelmap
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD","pg_isready","-U","travelmap","-d","travelmap"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: {context: ., target: api}
    restart: unless-stopped
    logging: *logging
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGHOST: db
      PGDATABASE: travelmap
      PGUSER: travelmap
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      GEOCODER_URL: ${GEOCODER_URL:-}
      GEOCODER_PROXY: ${GEOCODER_PROXY:-}
      ROUTE_PROXY: ${ROUTE_PROXY:-}
      ROUTE_DRIVE_URL: ${ROUTE_DRIVE_URL:-}
      ROUTE_WALK_URL: ${ROUTE_WALK_URL:-}
      ROUTE_BIKE_URL: ${ROUTE_BIKE_URL:-}
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 20
  web:
    build:
      context: .
      target: web
      args:
        VITE_TILE_URL: ${VITE_TILE_URL:-}
        VITE_TILE_ATTRIBUTION: ${VITE_TILE_ATTRIBUTION:-}
    restart: unless-stopped
    logging: *logging
    depends_on:
      api: {condition: service_healthy}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      PUBLIC_TRAVELMAP_HOST: ${PUBLIC_TRAVELMAP_HOST:-localhost}
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes: [certs:/data, caddyconfig:/config]
volumes:
  data:
  certs:
  caddyconfig:
